groups:
  - name: contest-reliability
    rules:
      - alert: ContestDependencyUnavailable
        expr: letcoding_dependency_up == 0
        for: 30s
        labels: {severity: critical}
        annotations: {summary: '比赛依赖不可用：{{ $labels.dependency }}'}
      - alert: ContestQueueTooOld
        expr: letcoding_contest_oldest_wait_seconds > 30
        for: 1m
        labels: {severity: warning}
        annotations: {summary: '正式提交最老等待时间超过 30 秒'}
      - alert: ContestPoolUnavailable
        expr: letcoding_contest_waiting > 0 and on() (sum(letcoding_worker_slots{pool=~"contest|all",state="accepting"}) == 0)
        for: 30s
        labels: {severity: critical}
        annotations: {summary: '有正式提交等待，但比赛池没有接收任务的槽位'}
      - alert: ContestProjectionBehind
        expr: letcoding_contest_projection_version_lag > 100
        for: 1m
        labels: {severity: warning}
        annotations: {summary: '榜单持续落后提交版本'}
      - alert: ContestSystemErrors
        expr: letcoding_contest_unresolved_system_errors > 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: '存在未解决的判题系统错误'}
      - alert: ContestOutboxStalled
        expr: letcoding_outbox_oldest_seconds > 30
        for: 1m
        labels: {severity: critical}
        annotations: {summary: '数据库 Outbox 长时间未能投递：{{ $labels.queue }}'}
      - alert: ContestMetricsUnavailable
        expr: up{job="letcoding"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: '比赛 API 指标采集失败'}
      - alert: ContestProjectionStale
        expr: letcoding_contest_projection_stale_seconds > 30
        for: 1m
        labels: {severity: warning}
        annotations: {summary: '存在超过 30 秒未更新的欠账榜单'}
      - alert: ContestProjectionRefreshFailing
        expr: letcoding_projection_consecutive_failures >= 3
        for: 30s
        labels: {severity: critical}
        annotations: {summary: '榜单刷新连续失败：{{ $labels.pool }}'}
      - alert: ContestAuditExportStalled
        expr: letcoding_audit_exporters == 0 or (time() - letcoding_audit_last_success_unix > 120) or letcoding_audit_consecutive_failures >= 3
        for: 1m
        labels: {severity: critical}
        annotations: {summary: '审计导出未运行或持续失败'}
      - alert: ContestBackupUnavailable
        expr: letcoding_backup_monitor_enabled == 0 or letcoding_backup_status_up == 0 or letcoding_backup_age_seconds > 86400
        for: 5m
        labels: {severity: critical}
        annotations: {summary: '备份监控缺失、状态无效或备份超过 24 小时'}
