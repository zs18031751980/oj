name: Backend reliability and isolation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: webapi/fastapi_of_letcoing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y redis-server postgresql openjdk-17-jdk prometheus
      - run: promtool check rules deploy/alerts.yaml && promtool test rules deploy/alerts.test.yaml
      - run: pip install -r requirements-dev.txt
      - run: pip install pip-audit && pip-audit -r requirements.txt
      - run: echo "PG_BINDIR=$(pg_config --bindir)" >> "$GITHUB_ENV"
      - run: python -m pytest -q --junitxml=backend-results.xml
      - run: docker build -f Dockerfile.sandbox -t letcoding-sandbox:local .
      - run: python -m pytest tests/sandbox_integration.py -q --junitxml=sandbox-results.xml
      - run: docker build -t letcoding-api:local .
      - run: docker build -f Dockerfile.worker -t letcoding-worker:local .
      - name: Preserve backend acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-acceptance-${{ github.sha }}
          path: webapi/fastapi_of_letcoing/*-results.xml
          retention-days: 14
  frontend-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: webapp/letapp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/letapp/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/check-bundle.mjs
      - run: node scripts/check-production.mjs
      - run: npx playwright test

  release-gate:
    name: Required release gate
    needs: [backend, frontend-contract]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all acceptance jobs
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend-contract.result }}
        run: test "$BACKEND_RESULT" = success && test "$FRONTEND_RESULT" = success

  promote-production:
    name: Promote verified commit to production
    needs: [release-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_PRODUCTION_PROMOTION == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    concurrency:
      group: production-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Fast-forward production only after every acceptance job passed
        env:
          ACCEPTED_SHA: ${{ github.sha }}
        run: python3 webapi/fastapi_of_letcoing/deploy/promote_release.py --sha "$ACCEPTED_SHA"
