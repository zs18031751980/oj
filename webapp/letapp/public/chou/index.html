<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#fcfaf9">
  <title>百团嘉年华抽奖</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-width: 0; margin: 0; }
    body { color: #292746; background: #fcfaf9; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; -webkit-text-size-adjust: 100%; }
    .page { width: 100%; max-width: 1080px; margin: 0 auto; padding: 52px 24px 32px; }
    .hero { text-align: center; }
    .logo-wrap { width: 96px; height: 96px; margin: 0 auto 16px; padding: 7px; border: 1px solid #f0e8ed; border-radius: 28px; background: #fff; box-shadow: 0 12px 30px rgba(126, 91, 132, .13); }
    .logo-wrap img { display: block; width: 100%; height: 100%; border-radius: 20px; object-fit: cover; }
    .brand, .eyebrow { color: #83709e; font-size: 11px; font-weight: 600; letter-spacing: .16em; }
    .brand { margin-bottom: 22px; }
    .eyebrow { color: #8b78b8; }
    h1 { margin: 14px 0 12px; font-size: 58px; line-height: 1.12; letter-spacing: -.06em; }
    .subtitle { margin: 0; color: #817f97; font-size: 16px; line-height: 1.7; }
    .draw-card { position: relative; max-width: 760px; min-height: 300px; margin: 52px auto 64px; padding: 54px 24px 44px; overflow: hidden; border: 1px solid rgba(255,255,255,.4); border-radius: 28px; color: #fff; text-align: center; background: linear-gradient(125deg, #efb16d 0%, #e88d8d 38%, #c27fa8 67%, #72a4d0 100%); box-shadow: 0 22px 52px rgba(166, 104, 130, .2); }
    .draw-card:before, .draw-card:after { position: absolute; width: 250px; height: 250px; border-radius: 50%; content: ""; opacity: .2; }
    .draw-card:before { top: -130px; left: -90px; background: #ffe6a8; }
    .draw-card:after { right: -120px; bottom: -150px; background: #61b9e4; }
    .draw-card > * { position: relative; }
    .result { min-height: 62px; margin: 24px 0; font-size: 38px; font-weight: 800; line-height: 1.3; letter-spacing: -.04em; }
    #draw-button { min-height: 48px; padding: 14px 26px; border: 0; border-radius: 999px; color: #674d69; background: #f9e4a0; font: inherit; font-size: 15px; font-weight: 700; box-shadow: 0 6px 0 rgba(184,132,96,.5); -webkit-appearance: none; }
    #draw-button:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(184,132,96,.48); }
    #draw-button[disabled] { opacity: .68; }
    .status { min-height: 18px; margin: 24px 0 0; color: rgba(255,255,255,.78); font-size: 12px; }
    .section-title { margin: 0 0 18px; padding-bottom: 13px; border-bottom: 1px solid #eee8ed; font-size: 21px; }
    .prizes { display: flex; flex-wrap: wrap; margin: -7px; }
    .prize { display: flex; align-items: center; width: calc(33.333% - 14px); min-width: 210px; margin: 7px; padding: 17px; border: 1px solid #eee8ed; border-radius: 16px; background: rgba(255,255,255,.88); box-shadow: 0 6px 18px rgba(126,91,132,.06); font-weight: 700; line-height: 1.45; }
    .icon { flex: 0 0 38px; width: 38px; height: 38px; margin-right: 12px; border-radius: 12px; color: #fff; background: linear-gradient(135deg, #efb16d, #ca82a5 55%, #8b78b8); text-align: center; font-size: 18px; line-height: 38px; }
    footer { margin-top: 54px; color: #aaa5ad; text-align: center; font-size: 12px; }
    @media (max-width: 700px) { h1 { font-size: 44px; } .prize { width: calc(50% - 14px); } }
    @media (max-width: 480px) { .page { padding: 38px 16px 28px; } .logo-wrap { width: 84px; height: 84px; } h1 { font-size: 38px; } .subtitle { font-size: 14px; } .draw-card { min-height: 270px; margin: 38px auto 52px; padding: 45px 16px 36px; border-radius: 24px; } .result { font-size: 29px; } .prize { width: 100%; min-width: 0; } }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="logo-wrap"><img src="./logo.jpg?v=3" alt="iOS Club XAUAT" onerror="this.onerror=null;this.src='/chou/logo.jpg?v=3';"></div>
      <div class="brand">iOS CLUB · XAUAT</div>
      <div class="eyebrow">LUCKY DRAW / 2026</div>
      <h1>百团嘉年华抽奖</h1>
      <p class="subtitle">玩数码，学编程，来iOSClub!</p>
    </section>
    <section class="draw-card" aria-live="polite">
      <div id="result" class="result">准备好了吗？</div>
      <button id="draw-button" type="button">开始抽奖</button>
      <p id="status" class="status"></p>
    </section>
    <section>
      <h2 class="section-title">奖品一览</h2>
      <div class="prizes" id="prizes"></div>
    </section>
    <footer>Powered by Lottery Builder · 祝你好运</footer>
  </main>
  <script>
    (function () {
      var prizes = [
        { name: 'iOS主题钥匙扣', weight: 25, icon: '✦' },
        { name: 'iOS主题扇子', weight: 20, icon: '◆' },
        { name: 'iOS主题应援周边', weight: 60, icon: '●' },
        { name: 'iOS主题手账本', weight: 10, icon: '◇' },
      ];
      var cooldownMs = 24 * 60 * 60 * 1000;
      var storageKey = 'lottery:last-draw:百团嘉年华抽奖';
      var result = document.getElementById('result');
      var status = document.getElementById('status');
      var button = document.getElementById('draw-button');
      var lastDrawMemory = '';
      var cooldownTimer = 0;
      var drawTimer = 0;

      function getLastDraw() { try { return window.localStorage.getItem(storageKey) || lastDrawMemory; } catch (e) { return lastDrawMemory; } }
      function saveLastDraw(value) { lastDrawMemory = value; try { window.localStorage.setItem(storageKey, value); } catch (e) {} }
      function random() {
        try {
          if (window.crypto && window.crypto.getRandomValues) {
            var bytes = new Uint32Array(1);
            window.crypto.getRandomValues(bytes);
            return bytes[0] / 4294967296;
          }
        } catch (e) {}
        return Math.random();
      }
      function isCoolingDown() { return Number(getLastDraw() || 0) + cooldownMs > new Date().getTime(); }
      function updateCooldown() {
        if (isCoolingDown()) { button.disabled = true; button.textContent = '暂不可抽奖'; status.textContent = '抽奖资格冷却中'; }
        else { button.disabled = false; button.textContent = '开始抽奖'; status.textContent = ''; if (cooldownTimer) { window.clearInterval(cooldownTimer); cooldownTimer = 0; } }
      }
      function pickPrize() {
        var total = 0, index, cursor;
        for (index = 0; index < prizes.length; index += 1) total += prizes[index].weight;
        cursor = random() * total;
        for (index = 0; index < prizes.length; index += 1) { cursor -= prizes[index].weight; if (cursor < 0) return prizes[index].name; }
        return prizes[prizes.length - 1].name;
      }
      function renderPrizes() {
        var html = '', index;
        for (index = 0; index < prizes.length; index += 1) html += '<article class="prize"><span class="icon">' + prizes[index].icon + '</span><span>' + prizes[index].name + '</span></article>';
        document.getElementById('prizes').innerHTML = html;
      }
      button.onclick = function () {
        var ticks = 0;
        if (button.disabled) return;
        saveLastDraw(String(new Date().getTime()));
        updateCooldown();
        cooldownTimer = window.setInterval(updateCooldown, 1000);
        status.textContent = '正在抽取 · GOOD LUCK';
        drawTimer = window.setInterval(function () {
          result.textContent = prizes[Math.floor(Math.random() * prizes.length)].name;
          ticks += 1;
          if (ticks >= 13) { window.clearInterval(drawTimer); result.textContent = pickPrize(); status.textContent = '抽取完成 · 抽奖资格冷却中'; }
        }, 75);
      };
      renderPrizes();
      updateCooldown();
    }());
  </script>
</body>
</html>
